name: Attach Debug APK To Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare debug keystore and gradlew
        shell: bash
        run: |
          chmod +x ./gradlew
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build and attach APK to release
        shell: bash {0}
        env:
          PACKAGE_VARIANT: apt-android-7
        run: |
          set -euo pipefail

          RELEASE_TAG="${GITHUB_REF/refs\/tags\//}"
          SEMVER_CANDIDATE="${RELEASE_TAG#v}"
          if printf "%s" "$SEMVER_CANDIDATE" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            export TERMUX_APP_VERSION_NAME="$SEMVER_CANDIDATE"
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          SAFE_TAG="$(printf '%s' "$RELEASE_TAG" | tr '/ ' '__')"
          APK_VERSION_TAG="${SAFE_TAG}+${PACKAGE_VARIANT}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"
          APK_OUTPUT_NAME="${APK_BASENAME_PREFIX}_arm64-v8a.apk"

          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"

          ./gradlew :app:assembleDebug --no-daemon

          if [ ! -f "$APK_DIR_PATH/app-debug-testkey.apk" ]; then
            echo "Failed to find built testkey APK at '$APK_DIR_PATH/app-debug-testkey.apk'"
            exit 1
          fi

          cp "$APK_DIR_PATH/app-debug-testkey.apk" "$APK_DIR_PATH/$APK_OUTPUT_NAME"
          (cd "$APK_DIR_PATH" && sha256sum "$APK_OUTPUT_NAME" > "${APK_BASENAME_PREFIX}_sha256sums")

          gh release upload "$RELEASE_TAG" \
            "$APK_DIR_PATH/$APK_OUTPUT_NAME" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums" \
            --clobber
