name: Debug Build (Release Branches)

on:
  push:
    branches:
      - 'github-releases/**'
  workflow_dispatch:
    inputs:
      package_variant:
        description: "Termux bootstrap package variant"
        required: false
        default: "apt-android-7"
        type: choice
        options:
          - apt-android-7
          - apt-android-5

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare debug keystore and gradlew
        shell: bash
        run: |
          chmod +x ./gradlew
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build APK
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ inputs.package_variant || 'apt-android-7' }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            GITHUB_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid semver string."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${PACKAGE_VARIANT}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"
          APK_OUTPUT_NAME="${APK_BASENAME_PREFIX}_arm64-v8a.apk"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> "$GITHUB_ENV"
          echo "APK_OUTPUT_NAME=$APK_OUTPUT_NAME" >> "$GITHUB_ENV"

          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"
          if ! ./gradlew :app:assembleDebug --no-daemon; then
            exit_on_error "Build failed for '$APK_VERSION_TAG' build."
          fi

          if [ ! -f "$APK_DIR_PATH/app-debug-testkey.apk" ]; then
            exit_on_error "Failed to find built testkey APK at '$APK_DIR_PATH/app-debug-testkey.apk'."
          fi

          cp "$APK_DIR_PATH/app-debug-testkey.apk" "$APK_DIR_PATH/$APK_OUTPUT_NAME"
          (cd "$APK_DIR_PATH" && sha256sum "$APK_OUTPUT_NAME" > "${APK_BASENAME_PREFIX}_sha256sums")

      - name: Attach arm64-v8a APK file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_arm64-v8a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_OUTPUT_NAME }}
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json
